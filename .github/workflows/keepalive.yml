name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (UTC)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o backend
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 "${{ secrets.HEALTH_URL }}"
